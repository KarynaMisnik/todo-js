<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FONT Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>To Do</title>
    <link rel="stylesheet" href="styles.css">
   
</head>
<!-- HTML -->

<body>
   
    <header>
        <h1>To Do List</h1>
    </header>
   
    <div class="todo-wrapper">

<aside>
    <nav>
<h2>Navigation</h2>
        <ul class="nav-bar-container">
            <li class="nav-item item1"><a href="index.html">HOME</a></li>
            <li class="nav-item item2"><a href="#contact-section">CONTACT</a></li>
            <li class="nav-item item2">ABOUT</li>
        </ul>
    </nav>
</aside>
        <main>
        <div class="add-new-todo">
            <div class="input-group">
                <input type="text" id="newTodo" placeholder="Add a new item">
                <div class="dropdown">
                    <button class="dropbtn">Priority</button>
                    <div class="dropdown-content">
                        <a href="#">HIGH</a>
                        <a href="#">MEDIUM</a>
                        <a href="#">LOW</a>
                    </div>
                </div>
            </div>

            <button id="addTodo">Add</button>
            <button id="sortButton">Sort by Priority</button>
            <button id="logPriorities">Log Priorities</button>
        </div>

  
        </main>
        <div class="list-container">
            <ul id="list">
        
        
            </ul>
        </div>
        
    </div>
        <div class="json">
           <div class="course-title"><h1>Course: <span id="course-name"></span></h1><h1>Status: <span id="status"></span></h1></div> 
            <h1>Teacher: <span id="teacher"></span></h1>
            <ul id="students">
                <li class="student-name"></li>
            </ul>
        </div>

        

<footer id="contact-section"><a href="contact.html" class="contact">&#169; Contacts</a>
<hero id="joke">
    <p id="setup"></p>
    <p id="punchline"></p>
</hero>
</footer>



    <!-- JavaScript -->

    <script src="main.js"> </script>

</body>

</html>
